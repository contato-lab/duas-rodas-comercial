name: Robô do Meta

on:
  schedule:
    - cron: "30 9 * * *"   # todo dia às 06h30 de Brasília
  workflow_dispatch: {}

concurrency:
  group: robo-meta
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Entrar no Google sem chave (identidade do GitHub)
        uses: google-github-actions/auth@v2
        with:
          project_id: comercial-duas-rodas-lime
          workload_identity_provider: projects/838601584480/locations/global/workloadIdentityPools/github/providers/github
          service_account: firebase-adminsdk-fbsvc@comercial-duas-rodas-lime.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar bibliotecas
        run: npm install --no-save --no-audit --no-fund @google-cloud/firestore@7 jimp@0.22.12
      - name: Puxar resultados dos posts do Instagram e do Facebook
        run: node robo-meta.js
        env:
          GOOGLE_CLOUD_PROJECT: comercial-duas-rodas-lime
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGINA_ID: ${{ vars.META_PAGINA_ID }}
