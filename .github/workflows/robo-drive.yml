name: Robô do Drive

on:
  schedule:
    - cron: "0 * * * *"   # de hora em hora (UTC)
  workflow_dispatch: {}

concurrency:
  group: robo-drive
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Entrar no Google sem chave (identidade do GitHub)
        uses: google-github-actions/auth@v2
        with:
          project_id: comercial-duas-rodas-lime
          workload_identity_provider: projects/838601584480/locations/global/workloadIdentityPools/github/providers/github
          service_account: firebase-adminsdk-fbsvc@comercial-duas-rodas-lime.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar bibliotecas
        run: npm install --no-save --no-audit --no-fund googleapis@144 @google-cloud/firestore@7
      - name: Varrer a pasta Comercial e lançar na fila
        run: node robo-drive.js
        env:
          GOOGLE_CLOUD_PROJECT: comercial-duas-rodas-lime
          DRIVE_PASTA_ID: ${{ vars.DRIVE_PASTA_ID }}
          DIAS_INICIAIS: ${{ vars.DIAS_INICIAIS }}
