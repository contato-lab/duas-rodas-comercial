name: Robô da Dinamize

on:
  schedule:
    - cron: "45 9 * * *"   # todo dia às 06h45 de Brasília
  workflow_dispatch: {}

concurrency:
  group: robo-dinamize
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Entrar no Google sem chave (identidade do GitHub)
        uses: google-github-actions/auth@v2
        with:
          project_id: comercial-duas-rodas-lime
          workload_identity_provider: projects/838601584480/locations/global/workloadIdentityPools/github/providers/github
          service_account: firebase-adminsdk-fbsvc@comercial-duas-rodas-lime.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar bibliotecas
        run: npm install --no-save --no-audit --no-fund @google-cloud/firestore@7
      - name: Ler os envios de e-mail marketing da Dinamize
        run: node robo-dinamize.js
        env:
          GOOGLE_CLOUD_PROJECT: comercial-duas-rodas-lime
          DINAMIZE_USER: ${{ secrets.DINAMIZE_USER }}
          DINAMIZE_PASSWORD: ${{ secrets.DINAMIZE_PASSWORD }}
          DINAMIZE_CLIENT_CODE: ${{ secrets.DINAMIZE_CLIENT_CODE }}
          DINAMIZE_DIAS: ${{ vars.DINAMIZE_DIAS }}
